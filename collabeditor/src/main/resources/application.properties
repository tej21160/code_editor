spring.application.name=collabeditor
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/collabeditor}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=60000
jwt.secret=${JWT_SECRET:collabeditor-super-secret-key-2026-must-be-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}
server.port=${PORT:8080}
